server {
    listen 80;
    server_name mv33.par73e.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/site-acme; }
    location / { return 308 https://mv33.par73e.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name mv33.par73e.cn;
    ssl_certificate /etc/letsencrypt/live/mv33.par73e.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mv33.par73e.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/mv33/current;
    index index.html;
    autoindex off;
    access_log /var/log/nginx/mv33-access.log;
    error_log /var/log/nginx/mv33-error.log;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    location ~ \.wasm$ { types { application/wasm wasm; } try_files $uri =404; add_header Cache-Control "public, max-age=604800"; }
    location ~ \.glb$ { types { model/gltf-binary glb; } try_files $uri =404; add_header Cache-Control "public, max-age=604800"; }
    location ~ /\. { deny all; }
}
